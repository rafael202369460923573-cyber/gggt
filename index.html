<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEMIG - Atendimento ao Cliente</title>
  <meta name="description" content="Acesse 2ª via, fatura digital, negociação de dívidas e fale com um atendente CEMIG.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
    }
    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      background-image: url(data:image/jpeg;base64,EOF
base64=$(cat /tmp/cemig.b64)
cat >> /mnt/documents/index.html <<EOF
$base64);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(2, 44, 34, 0.85), rgba(6, 78, 59, 0.80), rgba(2, 44, 34, 0.90));
    }
    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 48px 24px;
      text-align: center;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .subtitle {
      margin-top: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      color: rgba(209, 250, 229, 0.95);
    }
    .buttons {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.95);
      color: #064e3b;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      backdrop-filter: blur(4px);
    }
    .btn:hover {
      background: #fff;
      transform: scale(1.02);
      box-shadow: 0 14px 32px rgba(0,0,0,0.2);
    }
    .btn-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #d1fae5;
      color: #047857;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .btn:hover .icon {
      background: #047857;
      color: #fff;
    }
    .arrow {
      font-size: 1.25rem;
      color: #059669;
    }
    .btn-whatsapp {
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      background: #10b981;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .btn-whatsapp:hover {
      background: #34d399;
    }
    .btn-whatsapp .icon {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }
    .btn-whatsapp:hover .icon {
      background: rgba(255,255,255,0.3);
      color: #fff;
    }
    .footer {
      margin-top: 32px;
      font-size: 0.75rem;
      color: rgba(209, 250, 229, 0.7);
    }
    svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
